<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MetroMate174</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <meta name="theme-color" content="#0f172a">

    <link rel="apple-touch-icon" href="icon-192.png">
</head>

<body>

<header>
    <h1>🚌 MetroMate174</h1>
    <p>Your Personal Route 174 Dashboard</p>

    <div id="clock"></div>
    <div id="updated">Loading...</div>
</header>


<div class="container">

    <section class="card">

        <h2>
            🏠 Home ➜ City
        </h2>

        <h3>
            Stop 12501
        </h3>

        <table id="outboundTable">

            <thead>

            <tr>
                <th>Bus</th>
                <th>Arrival</th>
                <th>Minutes</th>
            </tr>

            </thead>

            <tbody>

            <tr>
                <td colspan="3">
                    Loading...
                </td>
            </tr>

            </tbody>

        </table>

    </section>



    <section class="card">

        <h2>
            🏢 City ➜ Home
        </h2>

        <h3>
            Stop 13284
        </h3>

        <table id="inboundTable">

            <thead>

            <tr>
                <th>Bus</th>
                <th>Arrival</th>
                <th>Minutes</th>
            </tr>

            </thead>

            <tbody>

            <tr>
                <td colspan="3">
                    Loading...
                </td>
            </tr>

            </tbody>

        </table>

    </section>

</div>


<footer>

    Route 174 • Adelaide Metro • Auto Refresh every 15 seconds

</footer>


<script src="app.js"></script>

</body>
</html>
