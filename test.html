<!DOCTYPE html>
<html>
<body>
<h2>Testing Adelaide Metro API...</h2>
<pre id="out">Loading...</pre>

<script>
fetch("https://api-cloudfront.adelaidemetro.com.au/stops/next-scheduled-services?stop=12501")
  .then(r => r.json())
  .then(data => {
    document.getElementById("out").textContent =
      "SUCCESS\n\n" + JSON.stringify(data, null, 2).substring(0, 1000);
  })
  .catch(err => {
    document.getElementById("out").textContent =
      "FAILED\n\n" + err;
  });
</script>

</body>
</html>
